---
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint does not support the `$/` self-repository syntax yet: https://github.com/rhysd/actionlint/issues/711
      - 'specifying action "\$/.+" in invalid format because ref is missing'
      - 'reusable workflow call "\$/.+" at "uses" is not following the format'
      # actionlint does not know the `copilot-requests` permission scope yet, which Copilot CLI needs to be billed to the organization
      - 'unknown permission scope "copilot-requests"'
