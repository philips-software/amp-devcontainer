---
name: Ubuntu snapshot proof

on:
  pull_request:
    paths:
      - .github/workflows/apt-snapshot-proof.yml
      - test/apt-snapshots/**
      - .devcontainer/**
  workflow_dispatch:
    inputs:
      snapshot:
        description: Ubuntu snapshot timestamp; empty uses the committed value
        required: false
        type: string

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  native-builds:
    name: Native builds (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build one base and validate every flavor sequentially
        run: |
          set -Eeuo pipefail
          source .devcontainer/base/apt-snapshot.sh
          SNAPSHOT="${REQUESTED_SNAPSHOT:-$(sed -n 's/^ARG UBUNTU_SNAPSHOT=//p' .devcontainer/base/Dockerfile)}"
          validate_snapshot "${SNAPSHOT}"
          mkdir -p snapshot-results
          sed -n 's/^FROM \(ubuntu:[^ ]*\).*/\1/p' .devcontainer/base/Dockerfile \
            | sort -u > snapshot-results/base-image.txt
          printf '%s\n' "${SNAPSHOT}" > snapshot-results/snapshot.txt
          docker build --progress plain --platform "linux/${TARGET_ARCH}" \
            --build-arg "UBUNTU_SNAPSHOT=${SNAPSHOT}" \
            -f .devcontainer/base/Dockerfile -t snapshot-base . \
            2>&1 | tee snapshot-results/base.log
          docker run --rm --entrypoint bats \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
            snapshot-base /workspace/test/apt-snapshots/test-probe.bats
          for FLAVOR in base cpp embedded-cpp docs rust embedded-rust; do
            if [[ "${FLAVOR}" != base ]]; then
              LANGUAGE="${FLAVOR#embedded-}"
              EMBEDDED=false
              if [[ "${FLAVOR}" == embedded-* ]]; then EMBEDDED=true; fi
              docker build --progress plain --platform "linux/${TARGET_ARCH}" \
                --build-arg BASE_IMAGE=snapshot-base \
                --build-arg "BUILD_EMBEDDED_FLAVOR=${EMBEDDED}" \
                -f ".devcontainer/${LANGUAGE}/Dockerfile" -t "snapshot-${FLAVOR}" . \
                2>&1 | tee "snapshot-results/${FLAVOR}.log"
            fi
            docker run --rm --entrypoint bash -e "EXPECTED_SNAPSHOT=${SNAPSHOT}" \
              "snapshot-${FLAVOR}" -Eeuo pipefail -c '
                test "$(cat /etc/apt/ubuntu-snapshot)" = "${EXPECTED_SNAPSHOT}"
                grep -Fx "URIs: https://snapshot.ubuntu.com/ubuntu/${EXPECTED_SNAPSHOT}/" /etc/apt/sources.list.d/ubuntu.sources
                gh --version
                dpkg-query -W -f="\${binary:Package}\t\${Version}\t\${Architecture}\n"
              ' > "snapshot-results/${FLAVOR}-packages.tsv"
            if [[ "${FLAVOR}" != base ]]; then
              docker image rm "snapshot-${FLAVOR}"
            fi
          done
        env:
          REQUESTED_SNAPSHOT: ${{ inputs.snapshot }}
          TARGET_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: snapshot-proof-${{ matrix.arch }}
          path: snapshot-results/
          if-no-files-found: error
          retention-days: 10
