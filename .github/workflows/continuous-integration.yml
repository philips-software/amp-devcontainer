---
name: CI

on:
  merge_group:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-push-test:
    name: Build → Push → Test
    uses: $/.github/workflows/build-push-test.yml
    permissions:
      actions: read # is needed by anchore/sbom-action to find workflow artifacts when attaching release assets
      artifact-metadata: write # is needed by actions/attest-build-provenance to write artifact metadata
      attestations: write # is needed by actions/attest-build-provenance to push attestations
      contents: write # is needed by anchore/sbom-action for artifact uploads
      id-token: write # is needed by actions/attest-build-provenance to obtain an OIDC token
      packages: write # is needed to push image manifest when using GitHub Container Registry
      pull-requests: write # is needed by marocchino/sticky-pull-request-comment to post comments
    secrets:
      TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
      TEST_GITHUB_USER: ${{ secrets.TEST_GITHUB_USER }}
      TEST_GITHUB_PASSWORD: ${{ secrets.TEST_GITHUB_PASSWORD }}
      TEST_GITHUB_TOTP_SECRET: ${{ secrets.TEST_GITHUB_TOTP_SECRET }}

  dependency-review:
    name: 🔍 Dependency Review
    needs: build-push-test
    uses: $/.github/workflows/wc-dependency-review.yml
    permissions:
      contents: read
      pull-requests: write # is needed by actions/dependency-review-action to write PR summaries

  publish-test-results:
    name: 📊 Publish Test Results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write # is needed by EnricoMi/publish-unit-test-result-action to add a check run with test results
      pull-requests: write # is needed by EnricoMi/publish-unit-test-result-action to annotate PRs
    needs: build-push-test
    if: ${{ !cancelled() }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          pattern: test-results-*
      - uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        with:
          action_fail: true
          action_fail_on_inconclusive: true
          files: test-report-*.xml

  generate-documents:
    name: 📄 Documentation
    uses: $/.github/workflows/wc-document-generation.yml
    permissions:
      contents: read

  helper-repository-tests:
    name: 🧰 Helper, Action & Repository Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The docs container provides Bats, jq, and the python3 and jinja2 needed by the tests.
    container: ghcr.io/philips-software/amp-devcontainer-docs:v8.0.0@sha256:86151248390ef9061fc98f872a5cc18bffd90ac201b169c2ad208e484dd06415
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run helper tests
        run: |
          set -Eeuo pipefail
          bats helpers/*/test .github/actions/*/test test/repository
        env:
          BATS_LIB_PATH: /usr/local

  node-action-tests:
    name: 🧰 Node.js Action Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The docs container used for the other tests has no Node.js
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Run action tests
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --prefix .github/actions/container-size-diff
          npm test --prefix .github/actions/container-size-diff
