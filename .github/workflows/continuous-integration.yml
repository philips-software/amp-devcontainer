---
name: CI

on:
  merge_group:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-push-test:
    name: Build → Push → Test
    uses: $/.github/workflows/build-push-test.yml
    permissions:
      actions: read # is needed by anchore/sbom-action to find workflow artifacts when attaching release assets
      artifact-metadata: write # is needed by actions/attest-build-provenance to write artifact metadata
      attestations: write # is needed by actions/attest-build-provenance to push attestations
      contents: write # is needed by anchore/sbom-action for artifact uploads
      id-token: write # is needed by actions/attest-build-provenance to obtain an OIDC token
      packages: write # is needed to push image manifest when using GitHub Container Registry
      pull-requests: write # is needed by marocchino/sticky-pull-request-comment to post comments
    secrets:
      TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
      TEST_GITHUB_USER: ${{ secrets.TEST_GITHUB_USER }}
      TEST_GITHUB_PASSWORD: ${{ secrets.TEST_GITHUB_PASSWORD }}
      TEST_GITHUB_TOTP_SECRET: ${{ secrets.TEST_GITHUB_TOTP_SECRET }}

  dependency-review:
    name: 🔍 Dependency Review
    needs: build-push-test
    uses: $/.github/workflows/wc-dependency-review.yml
    permissions:
      contents: read
      pull-requests: write # is needed by actions/dependency-review-action to write PR summaries

  publish-test-results:
    name: 📊 Publish Test Results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write # is needed by EnricoMi/publish-unit-test-result-action to add a check run with test results
      pull-requests: write # is needed by EnricoMi/publish-unit-test-result-action to annotate PRs
    needs: build-push-test
    if: ${{ !cancelled() }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          pattern: test-results-*
      - uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          action_fail: true
          action_fail_on_inconclusive: true
          files: test-report-*.xml

  generate-documents:
    name: 📄 Documentation
    uses: $/.github/workflows/wc-document-generation.yml
    permissions:
      contents: read

  helper-tests:
    name: 🧰 Helper Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: false # is needed by bats-core/bats-action to install the Bats libraries
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        id: bats
        with:
          assert-version: 2.2.4
          bats-version: 1.14.0
          detik-install: false
          file-install: false
          github-token: ${{ github.token }}
          support-version: 0.3.0
      - name: Run helper tests
        run: |
          set -Eeuo pipefail
          bats helpers/*/test
        env:
          BATS_LIB_PATH: ${{ steps.bats.outputs.lib-path }}
      # The action and the helper resolve inventories independently, they only share the
      # documented inventory format. Make sure they never drift apart on the real inventories.
      - name: Verify inventory resolution matches the generate-tool-inventory action
        run: |
          set -Eeuo pipefail
          source helpers/bats-tool-inventory/src/resolve-inventory.bash
          for inventory in .devcontainer/*/tool-inventory.json; do
            action_inventory=$(bash .github/actions/generate-tool-inventory/resolve.sh "${inventory}" | jq -S .)
            helper_inventory=$(resolve_inventory "${inventory}" | jq -S .)
            diff <(printf '%s\n' "${action_inventory}") \
                 <(printf '%s\n' "${helper_inventory}")
            echo "${inventory}: resolved identically"
          done
