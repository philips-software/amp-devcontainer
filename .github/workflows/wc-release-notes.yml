---
name: Release Notes

on:
  workflow_call:
    inputs:
      images:
        description: >-
          Newline-separated fully qualified container image references without tag, that are part of the release.
          The tool inventories of the images are expected as artifacts of this workflow run,
          named `tool-inventory-<image basename>`, and so are their SBOMs, `*.spdx.json`.
        required: true
        type: string
      registry:
        description: >-
          Docker registry of the images, to log in to.
          `DOCKER_REGISTRY_USERNAME` and `DOCKER_REGISTRY_PASSWORD` secrets must be set if not using GitHub Container Registry (ghcr.io).
        required: false
        type: string
        default: ghcr.io
      release-tag:
        description: Tag of the release to write the notes of, also the tag of the images.
        required: true
        type: string
      render-image:
        description: >-
          Reference of the container image, with a tag or a digest, that has python3 and jinja2 installed to render
          the template with, e.g. an amp-devcontainer-docs image. A reference with a tag is resolved to its digest.
          The image is pulled without credentials.
        required: true
        type: string
      runner-labels:
        description: >-
          JSON array used to select the runner.
          Must be valid JSON.

          Examples:
            '["ubuntu-latest"]'
            '["self-hosted", "linux", "x86_64"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      summary-artifact:
        description: >-
          Name of an artifact of this workflow run with the summary of the release in `release-summary.md`,
          see wc-release-summary.yml. The release notes are written without a summary when it is not set,
          or when the artifact does not exist.
        required: false
        type: string
      template-file:
        description: >-
          Path to the Jinja2 template of the release notes, relative to the root of the repository
          of the caller. Defaults to the template of the render-release-notes action.
        required: false
        type: string
    outputs:
      asset-names:
        description: JSON array of the names of the image assets that were uploaded to the release.
        value: ${{ jobs.release-notes.outputs.asset-names }}
    secrets:
      DOCKER_REGISTRY_PASSWORD:
        description: Password or token for Docker login, if not provided the GitHub token will be used.
        required: false
      DOCKER_REGISTRY_USERNAME:
        description: User name for Docker login, if not provided the GitHub actor will be used.
        required: false

permissions: {}

jobs:
  release-notes:
    name: 📝 Release Notes
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    timeout-minutes: 10
    outputs:
      asset-names: ${{ steps.release-assets.outputs.asset-names }}
    permissions:
      # Please note that contents: write is an overly broad scope, but GitHub does not
      # currently provide a more fine-grained permission for release modification.
      actions: read # is needed by actions/download-artifact to fetch the tool inventories
      attestations: read # is needed by gh to verify the attestations of the images in private and internal repositories
      contents: write # is needed to modify a release
      packages: read # is needed to inspect private images in GitHub Container Registry
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.template-file != '' }}
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD || github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tool-inventory-*
      - name: Download image SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/release-sboms
          pattern: "*.spdx.json"
      - name: Download release summary
        if: ${{ inputs.summary-artifact != '' }}
        # There is no summary when it could not be generated
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.summary-artifact }}
          path: ${{ runner.temp }}/release-summary
      - name: Get digest of the render image
        id: render-digest
        # An image that is referenced by its digest needs no lookup
        if: ${{ !contains(inputs.render-image, '@sha256:') }}
        uses: $/.github/actions/extract-manifest-digest
        with:
          container: ${{ inputs.render-image }}
      - name: Render release notes
        uses: $/.github/actions/render-release-notes
        with:
          images: ${{ inputs.images }}
          release-tag: ${{ inputs.release-tag }}
          render-image: ${{ steps.render-digest.outputs.digest && format('{0}@{1}', inputs.render-image, steps.render-digest.outputs.digest) || inputs.render-image }}
          summary-file: ${{ runner.temp }}/release-summary/release-summary.md
          template-file: ${{ inputs.template-file }}
      - name: Upload attestations, SBOMs and tool inventories
        id: release-assets
        uses: $/.github/actions/upload-release-assets
        with:
          images: ${{ inputs.images }}
          release-tag: ${{ inputs.release-tag }}
          sbom-directory: ${{ runner.temp }}/release-sboms
