---
name: 🐳 Integration Test

on:
  workflow_call:
    inputs:
      build-test-runner-labels:
        required: true
        type: string
      fully-qualified-image-name:
        required: true
        type: string
      image-basename:
        required: true
        type: string
      image-digest:
        required: true
        type: string
      registry:
        required: true
        type: string
      test-file:
        required: true
        type: string
    secrets:
      DOCKER_REGISTRY_PASSWORD:
        required: true
      DOCKER_REGISTRY_USERNAME:
        required: true

permissions: {}

jobs:
  run-test:
    name: 🐳 Integration Test (${{ (startsWith(matrix.runner, '[') && endsWith(matrix.runner, ']')) && join(matrix.runner, ', ') || matrix.runner }})
    strategy:
      matrix:
        runner: ${{ fromJson(inputs.build-test-runner-labels) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container:
      # The caller supplies the immutable digest produced by the build workflow.
      image: ${{ inputs.fully-qualified-image-name }}@${{ inputs.image-digest }} # zizmor: ignore[unpinned-images]
      # Actions need access to runner-owned command files; the tests run as code below.
      # ThreadSanitizer requires unconfined seccomp to function correctly.
      options: --user 0 --security-opt seccomp=unconfined
      credentials:
        # The identity of the workflow is only valid for ghcr.io, without credentials any other registry is used anonymously
        username: ${{ secrets.DOCKER_REGISTRY_USERNAME || (inputs.registry == 'ghcr.io' && github.actor || '') }}
        password: ${{ secrets.DOCKER_REGISTRY_PASSWORD || (inputs.registry == 'ghcr.io' && github.token || '') }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "arch=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        id: runner-arch
      - run: |
          set -Eeuo pipefail
          chown -R code:code "${GITHUB_WORKSPACE}"
          runuser -u code -- bats --formatter junit "${TEST_FILE}" | tee "test-report-${IMAGE_BASENAME}-${RUNNER_ARCH}.xml"
        shell: bash
        env:
          IMAGE_BASENAME: ${{ inputs.image-basename }}
          TEST_FILE: ${{ inputs.test-file }}
          RUNNER_ARCH: ${{ steps.runner-arch.outputs.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-results-integration-docker-${{ inputs.image-basename }}-${{ steps.runner-arch.outputs.arch }}
          path: test-report-*.xml
