---
name: 🦭 Integration Test

on:
  workflow_call:
    inputs:
      build-test-runner-labels:
        required: true
        type: string
      fully-qualified-image-name:
        required: true
        type: string
      image-basename:
        required: true
        type: string
      image-digest:
        required: true
        type: string
      registry:
        required: true
        type: string
      test-file:
        required: true
        type: string
    secrets:
      DOCKER_REGISTRY_PASSWORD:
        required: true
      DOCKER_REGISTRY_USERNAME:
        required: true

permissions: {}

jobs:
  run-test:
    name: 🦭 Integration Test (${{ (startsWith(matrix.runner, '[') && endsWith(matrix.runner, ']')) && join(matrix.runner, ', ') || matrix.runner }})
    strategy:
      matrix:
        runner: ${{ fromJson(inputs.build-test-runner-labels) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: false
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version
      - name: Login to container registry
        run: |
          set -Eeuo pipefail
          if [[ -z "${REGISTRY_USERNAME}" || -z "${REGISTRY_PASSWORD}" ]]; then
            echo "No credentials for ${REGISTRY}, using it anonymously"
            exit 0
          fi
          printf '%s' "${REGISTRY_PASSWORD}" | podman login "${REGISTRY}" --username "${REGISTRY_USERNAME}" --password-stdin
        env:
          REGISTRY: ${{ inputs.registry }}
          # The identity of the workflow is only valid for ghcr.io, without credentials any other registry is used anonymously
          REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME || (inputs.registry == 'ghcr.io' && github.actor || '') }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD || (inputs.registry == 'ghcr.io' && github.token || '') }}
      - name: Pull container image
        run: |
          podman pull "${IMAGE_WITH_DIGEST}"
        env:
          IMAGE_WITH_DIGEST: ${{ inputs.fully-qualified-image-name }}@${{ inputs.image-digest }}
      - run: echo "arch=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        id: runner-arch
      - name: Run integration tests using Podman
        run: |
          set -Eeuo pipefail
          podman run --rm \
            --security-opt seccomp=unconfined \
            --userns=keep-id:uid=1000,gid=1000 \
            --user 1000:1000 \
            --network=host \
            -v "${WORKSPACE}:${WORKSPACE}" \
            -w "${WORKSPACE}" \
            -e IMAGE_BASENAME="${IMAGE_BASENAME}" \
            -e TEST_FILE="${TEST_FILE}" \
            -e RUNNER_ARCH="${RUNNER_ARCH}" \
            "${IMAGE_WITH_DIGEST}" \
            bats --formatter junit "${TEST_FILE}" | tee "test-report-${IMAGE_BASENAME}-podman-${RUNNER_ARCH}.xml"
        env:
          IMAGE_BASENAME: ${{ inputs.image-basename }}
          IMAGE_WITH_DIGEST: ${{ inputs.fully-qualified-image-name }}@${{ inputs.image-digest }}
          RUNNER_ARCH: ${{ steps.runner-arch.outputs.arch }}
          TEST_FILE: ${{ inputs.test-file }}
          WORKSPACE: ${{ github.workspace }}
      - name: Log out of container registry
        if: ${{ always() }}
        # Without credentials there was no login, and logging out of a registry that was not logged in to fails
        run: |
          podman logout "${REGISTRY}" || echo "Not logged in to ${REGISTRY}"
        env:
          REGISTRY: ${{ inputs.registry }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-results-integration-podman-${{ inputs.image-basename }}-${{ steps.runner-arch.outputs.arch }}
          path: test-report-*.xml
