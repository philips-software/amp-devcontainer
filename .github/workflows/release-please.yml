---
name: Create Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}

permissions: {}

jobs:
  create-release:
    name: 🚀 Create Release
    uses: $/.github/workflows/wc-release-please.yml
    permissions:
      contents: read # is needed by actions/checkout to read the repository
    with:
      app-client-id: ${{ vars.FOREST_RELEASER_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.FOREST_RELEASER_APP_PRIVATE_KEY }}
