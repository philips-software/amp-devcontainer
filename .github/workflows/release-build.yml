---
name: Release Build

on:
  # release-please creates the tag together with a draft release, and the release is
  # published when the build is done and approved, see the job publish-release.
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  require-draft-release:
    name: 🔎 Require Draft Release
    if: ${{ !startsWith(github.ref_name, 'actions/') }}
    uses: $/.github/workflows/wc-require-draft-release.yml
    with:
      release-tag: ${{ github.ref_name }}
    permissions:
      contents: write # is needed by gh to find a draft release, which is only visible with write access

  build-push-test:
    name: Build → Push → Test
    if: ${{ !startsWith(github.ref_name, 'actions/') }}
    needs: require-draft-release
    uses: $/.github/workflows/build-push-test.yml
    permissions:
      actions: read # is needed by anchore/sbom-action to find workflow artifacts when attaching release assets
      artifact-metadata: write # is needed by actions/attest-build-provenance to write artifact metadata
      attestations: write # is needed by actions/attest-build-provenance to push attestations
      contents: write # is needed by anchore/sbom-action for artifact uploads
      id-token: write # is needed by actions/attest-build-provenance to obtain an OIDC token
      packages: write # is needed to push image manifest when using GitHub Container Registry
      pull-requests: write # is needed by marocchino/sticky-pull-request-comment to post comments
    secrets:
      TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
      TEST_GITHUB_USER: ${{ secrets.TEST_GITHUB_USER }}
      TEST_GITHUB_PASSWORD: ${{ secrets.TEST_GITHUB_PASSWORD }}
      TEST_GITHUB_TOTP_SECRET: ${{ secrets.TEST_GITHUB_TOTP_SECRET }}

  release-summary:
    name: ✨ Release Summary
    if: ${{ !startsWith(github.ref_name, 'actions/') }}
    needs: require-draft-release
    uses: $/.github/workflows/wc-release-summary.yml
    with:
      release-tag: ${{ github.ref_name }}
    permissions:
      contents: read # is needed by actions/checkout to read the history of the release
      copilot-requests: write # is needed by Copilot CLI to bill its requests to the organization

  release-notes:
    name: 📝 Release Notes
    # The summary is optional, so the release notes are written without it as well
    if: ${{ !cancelled() && needs.build-push-test.result == 'success' }}
    needs: [build-push-test, release-summary]
    uses: $/.github/workflows/wc-release-notes.yml
    with:
      # The images that are part of the release, the only place where they are listed.
      images: |
        ghcr.io/${{ github.repository }}-base
        ghcr.io/${{ github.repository }}-cpp
        ghcr.io/${{ github.repository }}-docs
        ghcr.io/${{ github.repository }}-embedded-cpp
        ghcr.io/${{ github.repository }}-embedded-rust
        ghcr.io/${{ github.repository }}-rust
      release-tag: ${{ github.ref_name }}
      # The image of the release that renders the release notes, it is built by this workflow.
      render-image: ghcr.io/${{ github.repository }}-docs:${{ github.ref_name }}
      summary-artifact: release-summary
    permissions:
      # Please note that contents: write is an overly broad scope, but GitHub does not
      # currently provide a more fine-grained permission for release modification.
      actions: read # is needed by actions/download-artifact to fetch the tool inventories
      attestations: read # is needed by gh to verify the attestations of the images
      contents: write # is needed to modify a release
      packages: read # is needed to inspect the images in GitHub Container Registry

  generate-documents:
    name: 📄 Documentation
    if: ${{ !startsWith(github.ref_name, 'actions/') }}
    needs: require-draft-release
    uses: $/.github/workflows/wc-document-generation.yml
    with:
      is-release: true
    permissions:
      contents: read

  upload-documents:
    name: 📄 Upload Documents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Please note that this is an overly broad scope, but GitHub does not
      # currently provide a more fine-grained permission for release modification.
      contents: write # is needed to modify a release
    needs: [generate-documents]
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: documents
      - name: Upload documents to release
        run: |
          set -Eeuo pipefail
          gh release upload --clobber "${REF_NAME}" ./*.pdf ./*.sbdl
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}

  publish-release:
    name: 🚀 Publish Release
    if: ${{ !startsWith(github.ref_name, 'actions/') }}
    needs: [release-notes, upload-documents]
    uses: $/.github/workflows/wc-publish-release.yml
    with:
      app-client-id: ${{ vars.FOREST_RELEASER_CLIENT_ID }}
      asset-names: ${{ needs.release-notes.outputs.asset-names }}
      release-tag: ${{ github.ref_name }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.FOREST_RELEASER_APP_PRIVATE_KEY }}
