---
name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-push-test:
    name: Build → Push → Test
    if: ${{ !startsWith(github.ref_name, 'actions/') }}
    uses: $/.github/workflows/build-push-test.yml
    permissions:
      actions: read # is needed by anchore/sbom-action to find workflow artifacts when attaching release assets
      artifact-metadata: write # is needed by actions/attest-build-provenance to write artifact metadata
      attestations: write # is needed by actions/attest-build-provenance to push attestations
      contents: write # is needed by anchore/sbom-action for artifact uploads
      id-token: write # is needed by actions/attest-build-provenance to obtain an OIDC token
      packages: write # is needed to push image manifest when using GitHub Container Registry
      pull-requests: write # is needed by marocchino/sticky-pull-request-comment to post comments
    secrets:
      TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
      TEST_GITHUB_USER: ${{ secrets.TEST_GITHUB_USER }}
      TEST_GITHUB_PASSWORD: ${{ secrets.TEST_GITHUB_PASSWORD }}
      TEST_GITHUB_TOTP_SECRET: ${{ secrets.TEST_GITHUB_TOTP_SECRET }}

  update-release-notes:
    name: 📝 Update Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Please note that this is an overly broad scope, but GitHub does not
      # currently provide a more fine-grained permission for release modification.
      actions: read # is needed by actions/download-artifact to fetch the tool inventory
      contents: write # is needed to modify a release
    needs: [build-push-test]
    env:
      # The images that are part of the release, the only place where they are listed.
      IMAGES: |
        ghcr.io/${{ github.repository }}-base
        ghcr.io/${{ github.repository }}-cpp
        ghcr.io/${{ github.repository }}-docs
        ghcr.io/${{ github.repository }}-embedded-cpp
        ghcr.io/${{ github.repository }}-embedded-rust
        ghcr.io/${{ github.repository }}-rust
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tool-inventory-${{ github.event.repository.name }}-*
      - name: Render release notes
        uses: ./.github/actions/render-release-notes
        with:
          images: ${{ env.IMAGES }}
          release-tag: ${{ github.ref_name }}
          render-image: ghcr.io/philips-software/amp-devcontainer-docs:v8.0.0@sha256:86151248390ef9061fc98f872a5cc18bffd90ac201b169c2ad208e484dd06415
      - name: Upload attestations and tool inventories
        # Images are processed one at a time so release asset uploads can't race each other.
        run: |
          set -Eeuo pipefail
          while IFS= read -r IMAGE; do
            [[ -n "${IMAGE}" ]] || continue
            IMAGE_NAME=${IMAGE##*/}
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${REF_NAME}" --format '{{json .}}' | jq -er '.manifest.digest // .manifests[0].digest')
            FORMATTED_DIGEST=${DIGEST//:/_}

            gh attestation verify --repo "${GH_REPO}" "oci://${IMAGE}@${DIGEST}" --format json --jq '.[] | .attestation.bundle.dsseEnvelope | select(.payloadType == "application/vnd.in-toto+json").payload' | base64 -d | jq . > "${REPOSITORY_OWNER}-${IMAGE_NAME}_${FORMATTED_DIGEST}.intoto.jsonl"
            gh release upload --clobber "${REF_NAME}" "${REPOSITORY_OWNER}-${IMAGE_NAME}_${FORMATTED_DIGEST}.intoto.jsonl"

            INVENTORY="${REPOSITORY_OWNER}-${IMAGE_NAME}_${FORMATTED_DIGEST}.tool-inventory.json"
            cp "tool-inventory-${IMAGE_NAME}/tool-inventory.json" "${INVENTORY}"
            gh release upload --clobber "${REF_NAME}" "${INVENTORY}"
          done <<< "${IMAGES}"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}

  publish-devcontainer-templates:
    name: 📝 Publish templates
    if: ${{ !startsWith(github.ref_name, 'actions/') }}
    uses: $/.github/workflows/wc-publish-templates.yml
    permissions:
      packages: write # is needed by devcontainers/action to write templates as OCI artifacts

  generate-documents:
    name: 📄 Documentation
    if: ${{ !startsWith(github.ref_name, 'actions/') }}
    uses: $/.github/workflows/wc-document-generation.yml
    with:
      is-release: true
    permissions:
      contents: read

  upload-documents:
    name: 📄 Upload Documents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Please note that this is an overly broad scope, but GitHub does not
      # currently provide a more fine-grained permission for release modification.
      contents: write # is needed to modify a release
    needs: [generate-documents]
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: documents
      - name: Upload documents to release
        run: |
          set -Eeuo pipefail
          gh release upload "${REF_NAME}" ./*.pdf ./*.sbdl
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}

  comment-released-prs:
    name: Comment on released PRs
    if: ${{ !startsWith(github.ref_name, 'actions/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # is needed by rdlf0/comment-released-prs-action to post comments on PRs
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo-and-containers: true
          egress-policy: audit
      - uses: rdlf0/comment-released-prs-action@249f57bed533baa7f883fe9d9a834424f153c3cb # v3.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
