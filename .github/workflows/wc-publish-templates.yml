---
name: Publish Templates

on:
  # Explicit empty mapping; the SchemaStore used by V8R linter rejects empty mappings.
  workflow_call: {}

permissions: {}

jobs:
  publish-devcontainer-templates:
    name: 📝 Publish templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write # is needed by devcontainers/action to write templates as OCI artifacts
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          disable-repo-tagging: true
          publish-templates: true
          base-path-to-templates: templates
