---
name: Supply-chain Security

on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: "16 19 * * 6"
  push:
    branches: [main]

permissions: {}

jobs:
  ossf-scorecard:
    name: 🛡️ OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # is needed by github/codeql-action/upload-sarif to upload sarif files
      id-token: write # is needed by ossf/scorecard-action to authenticate with OIDC
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
