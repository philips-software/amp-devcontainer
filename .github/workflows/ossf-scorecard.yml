---
name: Supply-chain Security

on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: "16 19 * * 6"
  push:
    branches: [main]

permissions: {}

jobs:
  ossf-scorecard:
    name: 🛡️ OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # is needed by github/codeql-action/upload-sarif to upload sarif files
      id-token: write # is needed by ossf/scorecard-action to authenticate with OIDC
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
