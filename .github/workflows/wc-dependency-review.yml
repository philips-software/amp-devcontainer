---
name: Dependency Review

on:
  workflow_call:
    inputs:
      runner-labels:
        description: >-
          JSON array used to select the action runner.
          Must be valid JSON.

          Examples:
            '["ubuntu-latest"]'
            '["self-hosted", "linux", "x86_64"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions: {}

jobs:
  dependency-review:
    name: Review
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # is needed by actions/dependency-review-action to write PR summaries
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: critical
