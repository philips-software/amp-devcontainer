---
name: 📦 Update

on:
  pull_request:
  schedule:
    - cron: "30 2 * * 0"
  workflow_dispatch:
    inputs:
      snapshot:
        description: Ubuntu snapshot timestamp; empty selects the previous UTC day
        required: false
        type: string

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-ubuntu-snapshot:
    name: Ubuntu snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # peter-evans/create-pull-request inherits app permissions; so we only need contents: read here
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/update-ubuntu-snapshot.sh "${REQUESTED_SNAPSHOT}"
        env:
          REQUESTED_SNAPSHOT: ${{ inputs.snapshot }}
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        if: github.event_name != 'pull_request'
        with:
          client-id: ${{ vars.FOREST_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.FOREST_RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: github.event_name != 'pull_request'
        with:
          commit-message: "chore(deps): update Ubuntu snapshot"
          branch: feature/amp-devcontainer/update-ubuntu-snapshot
          title: "chore(deps): update Ubuntu snapshot"
          body: |
            Advance the shared Ubuntu repository snapshot for all flavors and architectures.
            Signed metadata is verified before proposing the update. Native image builds
            and functional tests must pass before merging. Changes to Clang may require
            a coordinated Windows LLVM runtime version and checksum update.
          add-paths: .devcontainer/base/Dockerfile
          labels: dependencies,apt
          token: ${{ steps.token.outputs.token }}
          sign-commits: true

  update-vscode-extensions:
    name: ${{ github.event_name == 'pull_request' && '🧪' || '' }} Extensions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # peter-evans/create-pull-request inherits app permissions; so we only need contents: read here
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # continue-on-error is intentional: a single bad file shouldn't block a PR for the rest; see the trailing "Fail if..." step
      - uses: philips-software/amp-devcontainer/.github/actions/update-vscode-extensions@eccf76dc2da974d3e49531784bf4df2d0e8bbbaa # actions/v1.2.0
        id: update-extensions
        continue-on-error: true
        with:
          input-file: |
            .devcontainer/base/devcontainer.json
            .devcontainer/base/devcontainer-metadata.json
            .devcontainer/cpp/devcontainer.json
            .devcontainer/cpp/devcontainer-metadata.json
            .devcontainer/docs/devcontainer.json
            .devcontainer/docs/devcontainer-metadata.json
            .devcontainer/embedded-cpp/devcontainer.json
            .devcontainer/embedded-cpp/devcontainer-metadata.json
            .devcontainer/embedded-rust/devcontainer.json
            .devcontainer/embedded-rust/devcontainer-metadata.json
            .devcontainer/rust/devcontainer.json
            .devcontainer/rust/devcontainer-metadata.json
      - name: Generate PR body
        run: |
          {
            echo "> [!NOTE]"
            echo "> Before merging this PR, please conduct a manual test checking basic functionality of the updated plug-ins. There are limited automated tests for the VS Code Extension updates."
            echo ""
            cat "$MARKDOWN_SUMMARY_FILE"
          } >> "${RUNNER_TEMP}/pull-request-body.md"
        env:
          MARKDOWN_SUMMARY_FILE: ${{ steps.update-extensions.outputs.markdown-summary-file }}
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        if: github.event_name != 'pull_request'
        with:
          client-id: ${{ vars.FOREST_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.FOREST_RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: github.event_name != 'pull_request'
        with:
          commit-message: "Update VS Code extensions across devcontainers"
          branch: feature/amp-devcontainer/update-vscode-extensions
          body-path: ${{ runner.temp }}/pull-request-body.md
          title: "chore(deps): update VS Code extensions across devcontainers"
          labels: dependencies,vscode-extensions
          token: ${{ steps.token.outputs.token }}
          sign-commits: true
      - name: Fail if any file could not be updated
        if: steps.update-extensions.outcome == 'failure'
        run: exit 1
