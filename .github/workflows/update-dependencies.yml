---
name: 📦 Update

on:
  pull_request:
  schedule:
    - cron: "30 2 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-apt-dependencies:
    name: ${{ github.event_name == 'pull_request' && '🧪' || '' }} OS (🍨 ${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, cpp, docs, embedded-cpp, rust]
    uses: $/.github/workflows/wc-update-apt-packages.yml
    permissions:
      contents: read # is needed by actions/checkout to read the repository
    with:
      app-client-id: ${{ vars.FOREST_RELEASER_CLIENT_ID }}
      container-image: ghcr.io/${{ github.repository }}-${{ matrix.flavor }}:edge
      input-file: .devcontainer/${{ matrix.flavor }}/apt-requirements*.json
      name: ${{ matrix.flavor }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.FOREST_RELEASER_APP_PRIVATE_KEY }}

  update-vscode-extensions:
    name: ${{ github.event_name == 'pull_request' && '🧪' || '' }} Extensions
    uses: $/.github/workflows/wc-update-vscode-extensions.yml
    permissions:
      contents: read # is needed by actions/checkout to read the repository
    with:
      app-client-id: ${{ vars.FOREST_RELEASER_CLIENT_ID }}
      input-file: |
        .devcontainer/base/devcontainer.json
        .devcontainer/base/devcontainer-metadata.json
        .devcontainer/cpp/devcontainer.json
        .devcontainer/cpp/devcontainer-metadata.json
        .devcontainer/docs/devcontainer.json
        .devcontainer/docs/devcontainer-metadata.json
        .devcontainer/embedded-cpp/devcontainer.json
        .devcontainer/embedded-cpp/devcontainer-metadata.json
        .devcontainer/embedded-rust/devcontainer.json
        .devcontainer/embedded-rust/devcontainer-metadata.json
        .devcontainer/rust/devcontainer.json
        .devcontainer/rust/devcontainer-metadata.json
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.FOREST_RELEASER_APP_PRIVATE_KEY }}
