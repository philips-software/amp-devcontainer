---
name: Merge devcontainer.metadata
description: >-
  Assemble the devcontainer.metadata image label for a derived image by concatenating
  the base image's existing metadata array with the image's own metadata entry.

inputs:
  base-image:
    description: Reference of the image this image is built FROM (may be empty)
    required: false
    default: ""
  devcontainer-metadata-file:
    description: Path to the image's own devcontainer-metadata.json (may be absent)
    required: false
    default: ""

outputs:
  label:
    description: >-
      The `devcontainer.metadata=<json-array>` label value, or empty when no
      metadata file is provided.
    value: ${{ steps.merge.outputs.label }}

runs:
  using: composite
  steps:
    - id: merge
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/merge-devcontainer-metadata.sh"
      env:
        BASE_IMAGE: ${{ inputs.base-image }}
        DEVCONTAINER_METADATA_FILE: ${{ inputs.devcontainer-metadata-file }}
