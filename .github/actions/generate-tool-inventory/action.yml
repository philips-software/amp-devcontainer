---
name: Generate tool inventory
description: >-
  Derive a curated, per-flavor tool inventory from a Syft SPDX SBOM and write it
  to a JSON file.

inputs:
  sbom:
    description: Path to the Syft SPDX SBOM
    required: true
  allowlist:
    description: >-
      Path to the flavor's package-to-commands/files mapping JSON, relative
      to the caller repository root.
    required: true
  flavor:
    description: Name of the flavor the inventory is generated for
    required: true
  output-file:
    description: Path the generated tool inventory is written to
    required: false
    default: tool-inventory.json

outputs:
  inventory-file:
    description: Path to the generated tool inventory JSON file
    value: ${{ inputs.output-file }}

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -Eeuo pipefail

        jq -e '
          def paths: type == "array" and all(.[]; type == "string" and length > 0 and (test("[\\t\\r\\n]") | not));
          type == "object" and all(to_entries[];
            (.value | type == "object") and
            (.value | . as $entry |
              (keys - ["commands", "files", "smoke-test-args"] | length == 0) and
              (del(.["smoke-test-args"]) | all(.[]; paths)) and
              (. == {} or ((.commands // []) + (.files // []) | length > 0)) and
              (if has("smoke-test-args") then
                .["smoke-test-args"] | type == "object" and all(to_entries[];
                  (.key as $command | $entry.commands // [] | index($command) != null) and
                  (.value | paths and length > 0)
                )
              else true end)
            )
          )
        ' "${ALLOWLIST}" > /dev/null || {
          echo "error: invalid package-to-commands/files inventory: ${ALLOWLIST}" >&2
          exit 1
        }

        # Keep only packages whose name is on the flavor allowlist and project them
        # to {name, version, purl, commands, files}. Versions come from the SBOM, so the
        # inventory can never disagree with it.
        inventory="$(jq -n \
          --slurpfile sbom "${SBOM}" \
          --slurpfile allow "${ALLOWLIST}" \
          --arg flavor "${FLAVOR}" '
          ($allow[0] | with_entries(
            if .value == {} then .value = {commands: [.key]} else . end
            | .key |= ascii_downcase
          )) as $packages
          | ($packages | keys) as $names
          | [ $sbom[0].packages[]
              | select(.name != null)
              | . as $pkg
              | select($names | index($pkg.name | ascii_downcase))
              | { name: $pkg.name,
                  version: $pkg.versionInfo,
                  commands: ($packages[$pkg.name | ascii_downcase].commands // []),
                  files: ($packages[$pkg.name | ascii_downcase].files // []),
                  purl: ([ $pkg.externalRefs[]? | select(.referenceType == "purl") | .referenceLocator ] | first) } ]
          | unique_by(.name | ascii_downcase)
          | sort_by(.name | ascii_downcase)
          | { flavor: $flavor, tools: . }')"

        # Fail if an allowlisted tool is absent from the SBOM. This turns a version
        # bump that renames a package (e.g. clang-22 -> clang-23) or a tool that
        # silently dropped out of the image into a hard, actionable CI error.
        missing="$(jq -rn \
          --argjson inventory "${inventory}" \
          --slurpfile allow "${ALLOWLIST}" '
          ($inventory.tools | map(.name | ascii_downcase)) as $found
          | ($allow[0] | keys)
          | map(select((ascii_downcase) as $name | ($found | index($name)) | not))
          | .[]')"

        if [ -n "${missing}" ]; then
          echo "error: the following allowlisted tools were not found in the SBOM:" >&2
          echo "${missing}" | sed 's/^/  - /' >&2
          exit 1
        fi

        echo "${inventory}" | tee "${OUTPUT_FILE}"
      env:
        SBOM: ${{ inputs.sbom }}
        ALLOWLIST: ${{ inputs.allowlist }}
        FLAVOR: ${{ inputs.flavor }}
        OUTPUT_FILE: ${{ inputs.output-file }}
