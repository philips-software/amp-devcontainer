---
name: Generate tool inventory
description: >-
  Derive a curated tool inventory from a Syft SPDX SBOM and write it to a JSON file.

inputs:
  sbom:
    description: Path to the Syft SPDX SBOM
    required: true
  tool-inventory:
    description: >-
      Path to the inventory JSON of the image, relative to the caller repository
      root. Included inventories must also be checked out.
    required: true
  flavor:
    description: Name the inventory is reported under, it is stored in the `flavor` field of the output
    required: true
  output-file:
    description: Path the generated tool inventory is written to
    required: false
    default: tool-inventory.json

outputs:
  inventory-file:
    description: Path to the generated tool inventory JSON file
    value: ${{ inputs.output-file }}

runs:
  using: composite
  steps:
    - shell: bash
      run: bash "${GITHUB_ACTION_PATH}/generate-tool-inventory.sh"
      env:
        SBOM: ${{ inputs.sbom }}
        TOOL_INVENTORY: ${{ inputs.tool-inventory }}
        FLAVOR: ${{ inputs.flavor }}
        OUTPUT_FILE: ${{ inputs.output-file }}
