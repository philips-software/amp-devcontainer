---
name: 📎 Upload release assets
description: >-
  Verify the attestation of released container images and attach the attestations and
  tool inventories of the images, and optionally their SBOMs, to a GitHub release.

inputs:
  github-token:
    description: >-
      Token used to verify the attestations and to upload to the release, this requires `contents: write`.
    required: false
    default: ${{ github.token }}
  images:
    description: >-
      Newline-separated container image references without tag, e.g. `ghcr.io/my-org/my-image`.
      The last path segment is the image basename used in the names of the assets.
    required: true
  inventory-directory:
    description: >-
      Directory that contains a `tool-inventory-<image-basename>/tool-inventory.json` file
      for every image, as produced by downloading the tool inventory artifacts.
    required: false
    default: .
  release-tag:
    description: Tag of the release to upload to. The images are expected to have this tag as well.
    required: true
  sbom-directory:
    description: >-
      Optional directory containing the SBOM artifacts produced by anchore/sbom-action.
      When set, the SBOM of every image is required and uploaded.
    required: false
  signer-workflow:
    description: >-
      Re-usable workflow that signed the attestations, as `<owner>/<repository>/<path>`.
      Images that are built by a re-usable workflow of another repository, such as the
      one of amp-devcontainer, are only verified with the workflow that signed them.
    required: false
    default: philips-software/amp-devcontainer/.github/workflows/wc-build-push.yml

outputs:
  asset-names:
    description: JSON array of the names of the uploaded image assets.
    value: ${{ steps.upload.outputs.asset-names }}

runs:
  using: composite
  steps:
    - id: upload
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/upload-release-assets.sh"
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.github-token }}
        IMAGES: ${{ inputs.images }}
        INVENTORY_DIRECTORY: ${{ inputs.inventory-directory }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        SBOM_DIRECTORY: ${{ inputs.sbom-directory }}
        SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
